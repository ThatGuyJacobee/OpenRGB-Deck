<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Set OpenRGB Profile</title>
		<script src="sdpi-components.js"></script>
		<link rel="stylesheet" href="inspector.css" />
	</head>
	<body>
		<sdpi-item label="Profile">
			<sdpi-select
				setting="profile"
				datasource="getProfiles"
				placeholder="Select a profile"
				loading="Loading profiles…"
				show-refresh
				hot-reload
			></sdpi-select>
		</sdpi-item>

		<script src="plugin-settings.js"></script>
	</body>
</html>
