name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - run: npm run pack

      - name: Verify tag matches the manifest version
        run: |
          manifest="com.thatguyjacobee.openrgbdeck.sdPlugin/manifest.json"
          version=$(node -p "require('./$manifest').Version.split('.').slice(0, 3).join('.')")
          tag="${GITHUB_REF_NAME%%-*}"

          if [ "v$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest v$version"
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            "com.thatguyjacobee.openrgbdeck.streamDeckPlugin" \
            --draft \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            $prerelease
